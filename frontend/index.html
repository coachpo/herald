<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("herald_theme") || "system"; } catch {}
        document.documentElement.dataset.theme = preference === "dark" || preference === "light"
          ? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <link rel="preload" href="/fonts/ibm-plex-sans-400.ttf" as="font" type="font/ttf" crossorigin />
    <title>Herald</title>
    <meta name="description" content="Receive, store, and forward your notifications." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
