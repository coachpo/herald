[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-backend"
version = "1.0.0"
description = "Async FastAPI backend for Herald"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography==46.0.5",
    "fastapi==0.135.0",
    "httpx==0.28.1",
    "paho-mqtt==2.1.0",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
herald-backend = "backend.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = [
    "backend",
    "backend.core",
    "backend.providers",
]

[tool.setuptools.package-dir]
backend = "."
"backend.core" = "core"
"backend.providers" = "providers"
