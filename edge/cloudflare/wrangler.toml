name = "herald-relay"
main = "src/worker.mjs"
compatibility_date = "2026-02-16"

[vars]
UPSTREAM_URL = "https://backend.example.com"

[[kv_namespaces]]
binding = "EDGE_CONFIG"
id = "REPLACE_WITH_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "RELAY_BUFFER"
class_name = "RelayBuffer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayBuffer"]
