  "components": {
    "schemas": {
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "MessageInput": {
        "properties": {
          "title": {
            "type": "string",
            "title": "Title",
            "default": ""
          },
          "body": {
            "type": "string",
            "minLength": 1,
            "title": "Body"
          },
          "priority": {
            "type": "integer",
            "maximum": 5.0,
            "minimum": 1.0,
            "title": "Priority",
            "default": 3
          },
          "target_ids": {
            "anyOf": [
              {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              {
                "type": "null"
              }
            ],
            "title": "Target Ids"
          },
          "idempotency_key": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Idempotency Key"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "body"
        ],
        "title": "MessageInput"
      },
      "PriorityCondition": {
        "properties": {
          "field": {
            "type": "string",
            "const": "priority",
            "title": "Field"
          },
          "op": {
            "type": "string",
            "enum": [
              "eq",
              "gte",
              "lte"
            ],
            "title": "Op"
          },
          "value": {
            "type": "integer",
            "maximum": 5.0,
            "minimum": 1.0,
            "title": "Value"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "field",
          "op",
          "value"
        ],
        "title": "PriorityCondition"
      },
      "RoutingInput-Input": {
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Revision"
          },
          "rules": {
            "items": {
              "$ref": "#/components/schemas/RoutingRule"
            },
            "type": "array",
            "title": "Rules"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "revision",
          "rules"
        ],
        "title": "RoutingInput"
      },
      "RoutingInput-Output": {
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Revision"
          },
          "rules": {
            "items": {
              "$ref": "#/components/schemas/RoutingRule"
            },
            "type": "array",
            "title": "Rules"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "revision",
          "rules"
        ],
        "title": "RoutingInput"
      },
      "RoutingRule": {
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "title": "Id"
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          },
          "all": {
            "items": {
              "oneOf": [
                {
                  "$ref": "#/components/schemas/PriorityCondition"
                },
                {
                  "$ref": "#/components/schemas/TextCondition"
                }
              ],
              "discriminator": {
                "propertyName": "field",
                "mapping": {
                  "body": "#/components/schemas/TextCondition",
                  "priority": "#/components/schemas/PriorityCondition",
                  "title": "#/components/schemas/TextCondition"
                }
              }
            },
            "type": "array",
            "minItems": 1,
            "title": "All"
          },
          "target_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "minItems": 1,
            "title": "Target Ids"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "id",
          "all",
          "target_ids"
        ],
        "title": "RoutingRule"
      },
      "TargetInput": {
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Name"
          },
          "kind": {
            "type": "string",
            "enum": [
              "bark",
              "ntfy",
              "mqtt",
              "gotify"
            ],
            "title": "Kind"
          },
          "config": {
            "additionalProperties": true,
            "type": "object",
            "title": "Config"
          },
          "is_default": {
            "type": "boolean",
            "title": "Is Default",
            "default": false
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "name",
          "kind",
          "config"
        ],
        "title": "TargetInput"
      },
      "TextCondition": {
        "properties": {
          "field": {
            "type": "string",
            "enum": [
              "title",
              "body"
            ],
            "title": "Field"
          },
          "op": {
            "type": "string",
            "enum": [
              "eq",
              "prefix",
              "contains"
            ],
            "title": "Op"
          },
          "value": {
            "type": "string",
            "title": "Value"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "field",
          "op",
          "value"
        ],
        "title": "TextCondition"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
