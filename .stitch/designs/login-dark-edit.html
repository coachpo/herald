<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Bar / App Shell Header (Shared Components compliant) -->
<header class="w-full h-12 px-6 flex items-center justify-between bg-surface border-b border-outline-variant text-sm font-medium">
<div class="flex items-center gap-3">
<!-- Herald Signature Mark: 3 offset receipt strokes ending in arrow -->
<div class="flex items-center gap-2">
<svg aria-hidden="true" class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="3" x2="15" y1="6" y2="6"></line>
<line x1="5" x2="18" y1="12" y2="12"></line>
<line x1="3" x2="20" y1="18" y2="18"></line>
<polyline points="15 9 18 12 15 15"></polyline>
</svg>
<span class="font-headline text-base font-bold tracking-tight text-on-surface">Herald</span>
</div>
</div>
<!-- Right Controls: Status Pill & Appearance Segmented Control -->
<div class="flex items-center gap-3">
<!-- Theme Segmented Control: System / Light / Dark -->
<div aria-label="Appearance" class="flex items-center bg-surface-container-low border border-outline-variant rounded p-0.5 text-xs" role="radiogroup">
<button class="px-2 py-1 rounded text-outline hover:text-on-surface transition-colors flex items-center gap-1" title="System Theme" type="button">
<span class="material-symbols-outlined text-[16px]">brightness_auto</span>
<span class="hidden md:inline font-mono">Sys</span>
</button>
<button class="px-2 py-1 rounded text-outline hover:text-on-surface transition-colors flex items-center gap-1" title="Light Theme" type="button">
<span class="material-symbols-outlined text-[16px]">light_mode</span>
<span class="hidden md:inline font-mono">Light</span>
</button>
<button class="px-2 py-1 rounded bg-surface-container-high text-primary font-medium flex items-center gap-1 border border-outline-variant" title="Dark Theme (Active)" type="button">
<span class="material-symbols-outlined text-[16px]">dark_mode</span>
<span class="hidden md:inline font-mono">Dark</span>
</button>
</div>
</div>
</header>
<!-- Main Canvas Sheet Frame -->
<main class="flex-1 flex flex-col items-center justify-center p-6 md:p-10">
<div class="w-full max-w-2xl space-y-6">
<!-- Authentication Work Card -->
<section class="bg-surface-container border border-outline-variant rounded-lg p-6 sm:p-8">
<!-- Header -->
<div class="mb-6 pb-4 border-b border-outline-variant"><h1 class="font-headline text-[22px] font-semibold tracking-tight text-on-surface">Open your inbox</h1><p class="mt-1 text-sm text-outline">Use the management token from your server's <code class="font-mono text-on-surface-variant text-xs">credentials.env</code></p></div>
<!-- Token Entry Form -->
<form class="space-y-4" onsubmit="event.preventDefault(); handleConnect();">
<div>
<div class="flex items-center justify-between mb-1.5"><label class="text-xs font-medium text-on-surface uppercase tracking-wider" for="mgmt_token">Management token</label></div>
<div class="relative flex items-center">
<input autocomplete="off" class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded px-3 py-2 text-sm font-mono text-on-surface placeholder:text-outline-variant pr-24" id="mgmt_token" placeholder="••••••••••••••••••••••••••••••••" spellcheck="false" type="password" value="4f882bc71900e12d4a51e60cb6f5a3e1b782c949ad3e201b1a"/>
<button class="absolute right-1.5 px-2 py-1 text-xs text-outline hover:text-on-surface flex items-center gap-1 font-mono rounded bg-surface-container hover:bg-surface-container-high transition-colors" id="toggle-btn" onclick="toggleVisibility()" title="Toggle token visibility" type="button">
<span class="material-symbols-outlined text-[16px]" id="eye-icon">visibility</span>
<span id="eye-text">Show</span>
</button>
</div>
</div>
<!-- Interactive State Demonstration Bar -->
<div class="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3"><button class="w-full py-2.5 rounded bg-on-surface hover:opacity-90 text-surface font-headline text-sm font-semibold transition-colors flex items-center justify-center gap-2" id="connect-btn" type="submit"><span class="material-symbols-outlined text-[18px]">key</span><span>Connect</span></button></div>
</form>
<!-- Inline Error Banner Demo (Utility / Task-specific) -->
<!-- Security Disclosure Callout -->
<div class="mt-5 pt-4 border-t border-outline-variant flex items-start gap-2.5 text-xs text-outline"><span class="material-symbols-outlined text-[16px] text-outline mt-0.5">lock</span><p class="leading-normal text-xs text-outline">Management token is kept in this tab's session storage. Ingest uses a separate token.</p></div>
</section>
<!-- Architectural Explanation Ledger Panel: Delivery Pipeline Semantics -->
<div class="text-center py-2 space-y-1"><p class="text-xs font-mono tracking-wider text-outline uppercase">Receive → Store → Forward</p><p class="text-xs text-outline">Messages are stored before receipt; delivery continues in the background.</p></div>
<!-- Footer system metadata (strictly utility, no marketing) -->
</div>
</main>
<!-- Interactive script for pure state simulation -->
<script>
    function toggleVisibility() {
      const input = document.getElementById('mgmt_token');
      const icon = document.getElementById('eye-icon');
      const text = document.getElementById('eye-text');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
        text.textContent = 'Hide';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
        text.textContent = 'Show';
      }
    }

    function simulateHandshake() {
      const pill = document.getElementById('status-pill');
      const err = document.getElementById('error-banner');
      pill.classList.remove('hidden');
      pill.classList.add('flex');
      err.classList.add('hidden');

      setTimeout(() => {
        pill.classList.add('hidden');
        pill.classList.remove('flex');
        err.classList.remove('hidden');
      }, 1200);
    }

    function handleConnect() {
      const pill = document.getElementById('status-pill');
      pill.classList.remove('hidden');
      pill.classList.add('flex');
      setTimeout(() => {
        pill.classList.add('hidden');
        pill.classList.remove('flex');
      }, 800);
    }
  </script>
</body></html>
