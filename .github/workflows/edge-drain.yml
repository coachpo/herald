name: edge-drain
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain EdgeOne relay buffer
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RELAY_ADMIN_TOKEN }}" \
            "${{ secrets.EDGEONE_DRAIN_URL }}"
