services:
  herald:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HERALD_PORT:-8000}:8000"
    environment:
      HERALD_DATA_DIR: /data
      HERALD_HOST: 0.0.0.0
      HERALD_PORT: 8000
      HERALD_DELIVERY_TIMEOUT: ${HERALD_DELIVERY_TIMEOUT:-10}
      HERALD_MAX_ATTEMPTS: ${HERALD_MAX_ATTEMPTS:-5}
      HERALD_BACKOFF_BASE: ${HERALD_BACKOFF_BASE:-5}
      HERALD_BACKOFF_MAX: ${HERALD_BACKOFF_MAX:-300}
      HERALD_CONCURRENCY: ${HERALD_CONCURRENCY:-4}
      HERALD_RETENTION_DAYS: ${HERALD_RETENTION_DAYS:-30}
      HERALD_ADMIN_TOKEN: ${HERALD_ADMIN_TOKEN:-}
      HERALD_INGEST_TOKEN: ${HERALD_INGEST_TOKEN:-}
      HERALD_ENCRYPTION_KEY: ${HERALD_ENCRYPTION_KEY:-}
    volumes:
      - herald_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  herald_data:
